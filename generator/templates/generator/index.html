<!DOCTYPE html>
<html lang="en">

<head>
    <title>Random Number Generator</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded shadow-md text-center">
        <h1 class="text-2xl font-bold mb-4">🎲 Random Number Generator</h1>
        <div id="number" class="text-4xl font-mono mb-6 text-blue-600">--</div>
        <button onclick="generateNumber()" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded">
            Generate Number
        </button>
    </div>

    <script>
        function generateNumber(){
            fetch("/generate_random")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("number").innerText = data.number;
                })
                .catch(error => console.error('Error:', error));
        }
    </script>
</body>

</html>
